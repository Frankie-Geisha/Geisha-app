<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑰夏 - Gesha</title>
    <style>
        :root { --main-red: #D32F2F; --bg-cream: #FFFDF9; --text-gray: #444; }
        body { background-color: var(--bg-cream); margin: 0; font-family: sans-serif; }
        header { background: white; padding: 20px; text-align: center; border-bottom: 2px solid var(--main-red); position: sticky; top: 0; z-index: 100; }
        h1 { color: var(--main-red); margin: 0; font-size: 24px; letter-spacing: 2px; }
        #news-container { padding: 15px; max-width: 600px; margin: 0 auto; }
        
        /* 卡片设计 */
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eee; animation: fadeIn 0.5s ease; }
        .card-time { font-size: 12px; color: #999; margin-bottom: 8px; }
        .card-content { line-height: 1.6; color: var(--text-gray); font-size: 15px; word-break: break-all; }
        
        /* 协同按钮 */
        .actions { margin-top: 15px; border-top: 1px dashed #eee; padding-top: 10px; display: flex; justify-content: space-around; }
        .btn { cursor: pointer; color: #888; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .btn.active { color: var(--main-red); font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 加载状态 */
        #loader { text-align: center; padding: 20px; color: var(--main-red); font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>瑰 夏 · GESHA</h1>
        <p style="font-size: 11px; color: #999; margin: 5px 0 0 0;">瑰夏 团队协同情报站</p>
    </header>

    <div id="loader">正在调取全球情报信号...</div>
    <div id="news-container"></div>

    <script>
    // 1. 在这里填入你想追踪的频道ID（去掉@符号）
    const myChannels = ['rybar_pacific', 'ejdailyru', 'riakatysha', 'moscowtimes_ru', 'rybar']; 

    async function startGesha() {
        const container = document.getElementById('news-container');
        const loader = document.getElementById('loader');
        container.innerHTML = ''; // 清空界面

        // 一个一个去搬运
        for (const name of myChannels) {
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=https://rsshub.app/telegram/channel/${name}`;
            
            try {
                const res = await fetch(apiUrl);
                const data = await res.json();
                loader.style.display = 'none';

                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-time">频道: @${name}</div>
                        <div class="card-content">${item.description}</div>
                        <div class="actions">
                            <span class="btn" onclick="this.classList.toggle('active')">❤ 点赞</span>
                            <span class="btn">💬 评论</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) { console.log(name + " 搬运失败"); }
        }
    }
    startGesha();
    </script>
</body>
</html>
