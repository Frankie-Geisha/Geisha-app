<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑰夏 - Gesha</title>
    <style>
        :root { --main-red: #D32F2F; --bg-cream: #FFFDF9; --text-gray: #444; }
        body { background-color: var(--bg-cream); margin: 0; font-family: sans-serif; }
        header { background: white; padding: 20px; text-align: center; border-bottom: 2px solid var(--main-red); position: sticky; top: 0; z-index: 100; }
        h1 { color: var(--main-red); margin: 0; font-size: 24px; letter-spacing: 2px; }
        #news-container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .card-header { font-size: 13px; color: var(--main-red); font-weight: bold; padding: 12px 15px 5px; }
        .card-body { padding: 5px 15px 15px; line-height: 1.6; color: var(--text-gray); font-size: 15px; }
        .card-time { font-size: 11px; color: #999; margin-top: 10px; border-top: 1px solid #f5f5f5; padding-top: 8px; }
        #status { text-align: center; padding: 50px; color: #888; }
    </style>
</head>
<body>
    <header><h1>瑰 夏 · GESHA</h1></header>
    <div id="status">📡 正在接入专属情报频点...</div>
    <div id="news-container"></div>

    <script>
        async function initGesha() {
            const container = document.getElementById('news-container');
            const status = document.getElementById('status');

            // 核心改变：这是我为你预先配置好的“混合频道流”
            // 它跳过了不稳定的 RSSHub，直接从商业网关取货
            const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=https://rss.app/feeds/v1/tq09Y8n8I0n68mU3.xml`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (data.status === 'ok') {
                    status.style.display = 'none';
                    data.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        // 提取频道来源
                        const source = item.author || '情报源';
                        
                        card.innerHTML = `
                            <div class="card-header">@${source}</div>
                            <div class="card-body">
                                <div>${item.description}</div>
                                <div class="card-time">${new Date(item.pubDate).toLocaleString()}</div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                status.innerText = "专属频率连接受阻，请尝试刷新。";
            }
        }

        initGesha();
    </script>
</body>
</html>
