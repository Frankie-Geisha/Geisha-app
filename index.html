<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑰夏 - Gesha</title>
    <style>
        :root { --main-red: #D32F2F; --bg-cream: #FFFDF9; --text-gray: #444; }
        body { background-color: var(--bg-cream); margin: 0; font-family: sans-serif; }
        header { background: white; padding: 20px; text-align: center; border-bottom: 2px solid var(--main-red); position: sticky; top: 0; z-index: 100; }
        h1 { color: var(--main-red); margin: 0; font-size: 24px; letter-spacing: 2px; }
        #news-container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .card-header { font-size: 12px; color: var(--main-red); font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #f9f9f9; padding-bottom: 5px; }
        .card-body { line-height: 1.6; color: var(--text-gray); font-size: 15px; }
        .card-time { font-size: 11px; color: #999; margin-top: 10px; text-align: right; }
        #status { text-align: center; padding: 20px; color: #888; font-size: 14px; }
        .error-msg { color: #cc0000; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <header><h1>瑰 夏 · GESHA</h1></header>
    <div id="status">正在同步 5 路情报频道...</div>
    <div id="news-container"></div>

    <script>
        // 你的情报名单
        const channels = ['rybar_pacific', 'ejdailyru', 'riakatysha', 'moscowtimes_ru', 'rybar'];
        
        // 自动轮询函数
        async function fetchChannel(name) {
            const container = document.getElementById('news-container');
            // 使用更稳健的解析服务
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=https://rsshub.app/telegram/channel/${name}&api_key=your_free_key_optional`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok') {
                    document.getElementById('status').style.display = 'none';
                    data.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <div class="card-body">
                                <div class="card-header">@${name}</div>
                                <div>${item.description}</div>
                                <div class="card-time">${new Date(item.pubDate).toLocaleString()}</div>
                            </div>
                        `;
                        // 将新消息排在最前面
                        container.insertBefore(card, container.firstChild);
                    });
                }
            } catch (error) {
                console.error(`频道 ${name} 信号受阻`);
                const errDiv = document.createElement('div');
                errDiv.className = 'error-msg';
                errDiv.innerText = `⚠️ @${name} 频道同步失败`;
                container.appendChild(errDiv);
            }
        }

        // 批量执行
        channels.forEach(ch => fetchChannel(ch));
    </script>
</body>
</html>
